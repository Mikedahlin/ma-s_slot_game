<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lynne's Vegas Slots</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./ui-clean.css" />
  </head>
  <body class="clean-v2">
    <main class="casino">
      <header class="topbar">
        <div class="topbar-left">
          <p class="kicker">Vegas Floor Collection</p>
          <h1 id="themeTitle">Lynne's Starlight Jackpot</h1>
          <p id="themeSubtitle" class="subtitle">Premium multi-game slot cabinet with live bonuses</p>
          <p id="aiGuideText" class="guide-text">Lynne, let's warm up with a few steady spins.</p>
        </div>
        <div class="topbar-right">
          <label class="game-select-wrap" for="gameSelect">
            <span>Game</span>
            <select id="gameSelect"></select>
          </label>
        </div>
      </header>

      <section class="dashboard"></section>

      <section class="cabinet">
        <div class="cabinet-lights" aria-hidden="true"></div>
        <p id="slotMessage" class="slot-message">Press SPIN to start.</p>
        <div class="reel-shell">
          <div id="reelStrip" class="reel-strip" aria-live="polite"></div>
        </div>
        <div class="controls-row">
          <button id="spinBtn" class="spin-btn" type="button">SPIN</button>
        </div>
      </section>

      <section id="bonusOverlay" class="bonus-overlay hidden" aria-hidden="true">
        <div class="bonus-card">
          <h2 id="bonusTitle">Bonus Round</h2>
          <p id="bonusIntro"></p>
          <div id="bonusBody"></div>
        </div>
      </section>
    </main>

    <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
    <script src="./script.js"></script>
    <script src="./slot-hotfix.js"></script>
    <script src="./slot-fix-v2.js"></script>
  </body>
</html>
