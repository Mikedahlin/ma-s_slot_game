name: Import Lynnes Buffalo Base

on:
  push:
    branches:
      - rebuild/lynnes-buffalo-base
    paths:
      - .github/workflows/import-lynnes-buffalo-base.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-lynnes-buffalo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: rebuild/lynnes-buffalo-base
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone exact Lynnes Buffalo source repo
        run: |
          rm -rf /tmp/lynnes-buffalo-source
          git clone --depth 1 https://github.com/Mikedahlin/Lynnes-Buffalo-Slot.git /tmp/lynnes-buffalo-source

      - name: Replace app with Lynnes Buffalo working files
        run: |
          set -e
          mkdir -p _backup_before_lynnes_buffalo_import
          for item in index.html audio help-modal.css help-modal.js slot-machine.js styles.css package.json server.js README.md DEPLOY.md public scripts config.deploy.js lynnes-luxe-lights electron tests playwright.config.* slot-hotfix.js; do
            if [ -e "$item" ]; then
              mv "$item" _backup_before_lynnes_buffalo_import/ || true
            fi
          done

          cp /tmp/lynnes-buffalo-source/index.html ./index.html
          cp /tmp/lynnes-buffalo-source/help-modal.css ./help-modal.css
          cp /tmp/lynnes-buffalo-source/help-modal.js ./help-modal.js
          cp /tmp/lynnes-buffalo-source/slot-machine.js ./slot-machine.js
          cp /tmp/lynnes-buffalo-source/styles.css ./styles.css
          cp /tmp/lynnes-buffalo-source/README.md ./SOURCE-README.md
          cp /tmp/lynnes-buffalo-source/LICENSE ./LICENSE
          cp -R /tmp/lynnes-buffalo-source/audio ./audio

          cat > package.json <<'EOF'
          {
            "name": "mas-slot-lynnes-buffalo-base",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "description": "Ma's Slot rebuilt from the existing Lynnes Buffalo Slot repo with original audio preserved.",
            "engines": {
              "node": ">=20"
            },
            "scripts": {
              "start": "node server.js",
              "dev": "node server.js",
              "build": "node -e \"console.log('Static Lynnes Buffalo build: no bundling required.')\"",
              "audit:assets": "node scripts/audit-assets.mjs"
            }
          }
          EOF

          cat > server.js <<'EOF'
          import { createServer } from 'node:http';
          import { createReadStream, existsSync, statSync } from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const __filename = fileURLToPath(import.meta.url);
          const __dirname = path.dirname(__filename);
          const PORT = Number(process.env.PORT || 3000);

          const MIME_TYPES = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.gif': 'image/gif',
            '.svg': 'image/svg+xml',
            '.ico': 'image/x-icon',
            '.wav': 'audio/wav',
            '.mp3': 'audio/mpeg',
            '.ogg': 'audio/ogg'
          };

          function safeResolve(urlPath) {
            const cleanPath = decodeURIComponent(urlPath.split('?')[0]).replace(/^\/+/, '');
            const requested = cleanPath === '' ? 'index.html' : cleanPath;
            const resolved = path.resolve(__dirname, requested);
            if (!resolved.startsWith(__dirname)) return null;
            return resolved;
          }

          const server = createServer((req, res) => {
            if (req.url === '/health') {
              res.writeHead(200, { 'Content-Type': 'application/json; charset=utf-8' });
              res.end(JSON.stringify({ ok: true, app: 'mas-slot-lynnes-buffalo-base' }));
              return;
            }

            const filePath = safeResolve(req.url || '/');
            if (!filePath || !existsSync(filePath) || !statSync(filePath).isFile()) {
              res.writeHead(404, { 'Content-Type': 'text/plain; charset=utf-8' });
              res.end('Not found');
              return;
            }

            const ext = path.extname(filePath).toLowerCase();
            res.writeHead(200, { 'Content-Type': MIME_TYPES[ext] || 'application/octet-stream' });
            createReadStream(filePath).pipe(res);
          });

          server.listen(PORT, '0.0.0.0', () => {
            console.log(`Lynnes Buffalo base running on port ${PORT}`);
          });
          EOF

          mkdir -p scripts
          cat > scripts/audit-assets.mjs <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          let failed = false;

          const requiredFiles = [
            'index.html',
            'styles.css',
            'help-modal.css',
            'help-modal.js',
            'slot-machine.js',
            'audio/coinHandling.wav',
            'audio/reelSpin.mp3',
            'audio/reelStop.mp3',
            'audio/scatterHit.mp3',
            'audio/slotFeature.mp3',
            'audio/slotPull.mp3',
            'audio/slotWin.mp3',
            'audio/slotsBG.mp3',
            'audio/winSmall.wav'
          ];

          for (const file of requiredFiles) {
            const full = path.join(root, file);
            if (!existsSync(full)) {
              console.error(`Missing required file: ${file}`);
              failed = true;
            } else {
              console.log(`OK file: ${file}`);
            }
          }

          const slotJs = readFileSync(path.join(root, 'slot-machine.js'), 'utf8');
          if (slotJs.includes("this.useImages = false")) {
            console.log('OK image mode is disabled; no missing image folder required for current runtime.');
          } else {
            console.error('Image mode appears enabled. Verify images/ exists with every symbol .png before deploy.');
            failed = true;
          }

          if (slotJs.includes("this.imagesPath = 'images/'") && !existsSync(path.join(root, 'images'))) {
            console.log('NOTE images/ folder is absent, but image mode is disabled. This repo uses emoji symbols unless image mode is intentionally enabled later.');
          }

          if (failed) process.exit(1);
          console.log('Asset audit passed.');
          EOF

          cat > README.md <<'EOF'
          # Ma's Slot — Lynnes Buffalo Base

          This branch imports the existing `Mikedahlin/Lynnes-Buffalo-Slot` project into `ma-s_slot_game` and makes it runnable as a normal app instead of opening `index.html` from Downloads.

          ## Important reality check

          The source repo includes audio files, but it does not include an `images/` folder. The current code has image mode disabled:

          ```js
          this.useImages = false;
          ```

          That means the game currently uses emoji/text symbols, not real PNG reel art.

          ## Run locally

          ```bash
          npm install
          npm start
          ```

          Open:

          ```text
          http://localhost:3000
          ```

          ## Audit

          ```bash
          npm run audit:assets
          ```

          ## Railway

          Start command:

          ```bash
          npm start
          ```

          The server uses `process.env.PORT || 3000`.
          EOF

          cat > DEPLOY.md <<'EOF'
          # Railway Deploy Notes

          Static app served by `server.js`.

          ## Build command

          ```bash
          npm run build
          ```

          ## Start command

          ```bash
          npm start
          ```

          ## Health check

          ```text
          /health
          ```

          ## Known limitation

          Source repo has audio files but no `images/` folder. Do not enable image mode until the exact PNG files exist.
          EOF

      - name: Audit assets
        run: node scripts/audit-assets.mjs

      - name: Commit imported base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import Lynnes Buffalo base with Railway server"
            git push origin rebuild/lynnes-buffalo-base
          fi
